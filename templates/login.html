<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌐 𝕋𝕦𝕣𝕓𝕠 𝕋𝕦𝕟𝕟𝕖𝕝 𝕄𝕄 🌐 | Log in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%230f2238'/%3E%3Ccircle cx='20' cy='20' r='13' stroke='%2336c5f4' stroke-width='2' fill='none' opacity='.35'/%3E%3Ccircle cx='20' cy='20' r='8.5' stroke='%2336c5f4' stroke-width='2' fill='none' opacity='.65'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%2336c5f4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&family=Noto+Sans+Math&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
    --ink:#070c18;
    --panel:#101a2f;
    --panel2:#15213a;
    --line:#1f2d4d;
    --line2:#172340;
    --text:#e8eefc;
    --muted:#92a0c1;
    --faint:#62708f;
    --accent:#36c5f4;
    --accent-ink:#04202c;
    --bad:#ff6b86;
    --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --display:'Sora','Manrope',system-ui,sans-serif;
    --math:'Noto Sans Math','Cambria Math','STIX Two Math','Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2',sans-serif;
}

html,body{min-height:100%}

body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    overflow-x:hidden;
    background:var(--ink);
    color:var(--text);
    font-family:var(--font);
    font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit;text-decoration:none}

/* tunnel rings, the signature of the page */
.tunnel{
    position:fixed;left:50%;top:50%;
    width:min(1400px,160vmax);height:min(1400px,160vmax);
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:0;
}
.tunnel i{
    position:absolute;left:50%;top:50%;
    border-radius:50%;
    border:1px solid rgba(54,197,244,.16);
    transform:translate(-50%,-50%) scale(.2);
    opacity:0;
    animation:ringIn 1.6s cubic-bezier(.2,.7,.2,1) forwards;
}
.tunnel i:nth-child(1){width:14%;height:14%;animation-delay:.05s;border-color:rgba(54,197,244,.34)}
.tunnel i:nth-child(2){width:24%;height:24%;animation-delay:.15s;border-color:rgba(54,197,244,.26)}
.tunnel i:nth-child(3){width:36%;height:36%;animation-delay:.25s;border-color:rgba(54,197,244,.2)}
.tunnel i:nth-child(4){width:50%;height:50%;animation-delay:.35s;border-color:rgba(54,197,244,.15)}
.tunnel i:nth-child(5){width:66%;height:66%;animation-delay:.45s;border-color:rgba(54,197,244,.1)}
.tunnel i:nth-child(6){width:84%;height:84%;animation-delay:.55s;border-color:rgba(54,197,244,.07)}
.tunnel i:nth-child(7){width:104%;height:104%;animation-delay:.65s;border-color:rgba(54,197,244,.05)}
@keyframes ringIn{
    from{opacity:0;transform:translate(-50%,-50%) scale(.2)}
    to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

.wrap{position:relative;z-index:1;width:100%;max-width:410px}

.card{
    padding:34px 28px 26px;
    border-radius:22px;
    background:rgba(16,26,47,.9);
    border:1px solid var(--line);
    backdrop-filter:blur(14px);
    box-shadow:0 30px 80px rgba(0,0,0,.5);
}

.brand{text-align:center;margin-bottom:28px}
.brand-mark{width:56px;height:56px;margin:0 auto 16px;display:block}
.brand h1{
    font-family:var(--math);
    font-size:22px;font-weight:700;line-height:1.3;
}
.brand p{margin-top:6px;color:var(--muted);font-size:14px}

.error{
    margin-bottom:18px;padding:12px 14px;border-radius:11px;
    background:rgba(255,107,134,.1);border:1px solid rgba(255,107,134,.35);
    color:var(--bad);font-size:13px;font-weight:600;text-align:center;
}

.group{margin-bottom:16px}
label{display:block;margin-bottom:8px;font-size:13px;font-weight:700}

.field{position:relative}
.field svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;color:var(--faint);pointer-events:none;
    transition:color .15s;
}
.field:focus-within svg{color:var(--accent)}

input{
    width:100%;height:50px;padding:0 14px 0 42px;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--ink);
    color:var(--text);
    font-family:inherit;font-size:15px;
    outline:none;
    transition:border-color .15s,box-shadow .15s;
}
input::placeholder{color:var(--faint)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(54,197,244,.16)}

.btn{
    width:100%;height:50px;margin-top:6px;
    border:0;border-radius:11px;
    background:var(--accent);color:var(--accent-ink);
    font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
    transition:background .15s,transform .1s;
}
.btn:hover{background:#5cd3f8}
.btn:active{transform:scale(.99)}

.default-info{
    margin-top:18px;padding:12px 14px;border-radius:12px;
    background:var(--ink);border:1px solid var(--line2);
    text-align:center;font-size:13px;color:var(--muted);
}
.default-info strong{color:var(--text);font-weight:700}

.footer{
    margin-top:22px;padding-top:18px;
    border-top:1px solid var(--line2);
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    font-size:13px;color:var(--muted);
}
.footer a{color:var(--accent);font-weight:700}
.footer a:hover{text-decoration:underline}

@media(max-width:420px){
    .card{padding:28px 20px 22px;border-radius:20px}
    .footer{justify-content:center;text-align:center}
}

@media(prefers-reduced-motion:reduce){
    .tunnel i{animation:none;opacity:1;transform:translate(-50%,-50%) scale(1)}
}
</style>
</head>

<body>

<div class="tunnel" aria-hidden="true">
    <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
</div>

<div class="wrap">

    <div class="card">

        <div class="brand">
            <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
                <rect width="40" height="40" rx="11" fill="#0f2238"/>
                <circle cx="20" cy="20" r="13" stroke="#36c5f4" stroke-width="2" opacity=".32"/>
                <circle cx="20" cy="20" r="8.5" stroke="#36c5f4" stroke-width="2" opacity=".64"/>
                <circle cx="20" cy="20" r="4" fill="#36c5f4"/>
            </svg>
            <h1>🌐 𝕋𝕦𝕣𝕓𝕠 𝕋𝕦𝕟𝕟𝕖𝕝 𝕄𝕄 🌐</h1>
            <p>Log in to manage your VLESS server</p>
        </div>

        {% if error %}
        <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <div class="group">
                <label for="username">Username</label>
                <div class="field">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="off" required>
                </div>
            </div>

            <div class="group">
                <label for="password">Password</label>
                <div class="field">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="off" required>
                </div>
            </div>

            <button type="submit" class="btn">Log in</button>

        </form>

        <div class="default-info">
            Default login: <strong>admin</strong> / <strong>admin</strong>
        </div>

        <div class="footer">
            <a href="https://t.me/arsar2027" target="_blank" rel="noopener">Join Telegram</a>
            <span>Developer <a href="https://t.me/turbomm750" target="_blank" rel="noopener">@turbomm750</a></span>
        </div>

    </div>

</div>

</body>
</html>
